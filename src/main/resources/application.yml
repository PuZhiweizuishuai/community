spring:
  application:
    name: community
  # 默认激活 local profile：敏感凭据放在 application-local.yml（已 gitignore），
  # 新环境请复制 application-example.yml 为 application-local.yml 并填写真实值
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    # Spring Boot 4 默认使用 HikariCP，已移除 DruidDataSource，无需再指定 type
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://192.168.0.100:3306/community?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD}
    hikari:
      pool-name: CommunityHikariPool
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
  flyway:
    enabled: true
    locations: classpath:db/migration
    # 已手动执行过 SQL_Upgrade 001/002 的旧库：基线定在 V3，只补跑 V4 及以后；
    # 空库会从 V1 全量执行
    baseline-on-migrate: true
    baseline-version: 3
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 1s
  cache:
    redis:
      time-to-live: 1h
  servlet:
    multipart:
      # 限制单文件最大大小
      max-file-size: 10MB
      # 限制整个请求最大大小
      max-request-size: 20MB
  messages:
    basename: i18n.index
  # SMTP 邮件（找回密码/注册验证码）；不配置 host 时邮件能力自动关闭
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:465}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true

server:
  port: 8080

# 前后端分离：仅当 Vue 前端独立部署（非 Vite 代理）时需要放开跨域来源
app:
  cors:
    allowed-origins: http://localhost:5173,http://127.0.0.1:5173
  cookie:
    # 生产启用 HTTPS 后改为 true，token cookie 将带 Secure 标记
    secure: ${COOKIE_SECURE:false}
  mail:
    # 配置好 SMTP 后改为 true（或 MAIL_ENABLED=true），启用找回密码与注册邮箱验证码
    enabled: ${MAIL_ENABLED:false}
    from: ${MAIL_FROM:}
  # 找回密码邮件中的前端链接地址
  frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:5173}
#  ssl:
#    key-store: buguagaoshu.key
#    key-store-type: PKCS12
#    key-alias: buguagaoshu
#    key-store-password: buguagaoshu

# 应用根目录下的文件名
File:
  ROOT:
    PATH: file
  LOG:
    PATH: log

logging:
  file:
    name: log/spring.log
  logback:
    rollingpolicy:
      max-history: 30
      max-file-size: 10MB
  level:
    root: info
#    com:
#      buguagaoshu:
#        community:
#          mapper: debug

# 每页广告数
advertisement:
  number: 3

jwt:
  # 签名密钥从环境变量 / application-local.yml 注入，禁止提交真实值；
  # 轮换密钥会使所有已签发的「记住我」token 失效
  key: ${JWT_KEY}
  ttl: 7200000

# 对象存储（S3 兼容）配置已迁移到数据库 storage_config 表，
# 在管理后台「存储配置」页面维护，不再通过 yml 配置

