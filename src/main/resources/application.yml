spring:
  application:
    name: community
  datasource:
    # Spring Boot 4 默认使用 HikariCP，已移除 DruidDataSource，无需再指定 type
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://192.168.0.100:3306/community?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
    username: root
    password: 123456
    hikari:
      pool-name: CommunityHikariPool
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
  data:
    redis:
      host: 192.168.0.100
      port: 6379
      # 实测测试环境 Redis 未设置密码，配置密码会导致 AUTH 报错
      # password:
      timeout: 1s
  cache:
    redis:
      time-to-live: 1h
  servlet:
    multipart:
      # 限制单文件最大大小
      max-file-size: 10MB
      # 限制所有文件最大大小
      max-request-size: 1024MB
  messages:
    basename: i18n.index

server:
  port: 8080

# 前后端分离：仅当 Vue 前端独立部署（非 Vite 代理）时需要放开跨域来源
app:
  cors:
    allowed-origins: http://localhost:5173,http://127.0.0.1:5173
#  ssl:
#    key-store: buguagaoshu.key
#    key-store-type: PKCS12
#    key-alias: buguagaoshu
#    key-store-password: buguagaoshu

# 应用根目录下的文件名
File:
  ROOT:
    PATH: file
  LOG:
    PATH: log

logging:
  file:
    name: log/spring.log
  logback:
    rollingpolicy:
      max-history: 7
      max-file-size: 1MB
  level:
    root: info
#    com:
#      buguagaoshu:
#        community:
#          mapper: debug

# 每页广告数
advertisement:
  number: 3

jwt:
  key: buguagaoshu
  ttl: 7200000

# S3 兼容对象存储（AWS SDK v2）
# 沿用原 MinIO 地址；若该地址不可用，请改成实际可用的 S3 / MinIO 端点
s3:
  endpoint: http://192.168.147.132:9000
  region: us-east-1
  access-key: admin
  secret-key: admin
  bucket: community
  out-time: 86400
  path-style-access: true
