spring:
  web:
    resources:
      chain:
        cache: true
        enabled: true
        compressed: true
      cache:
        period: 2592000
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/community?useUnicode=true&characterEncoding=UTF-8
    username: root
    password: 123456
    type: com.alibaba.druid.pool.DruidDataSource

  servlet:
    multipart:
      # 限制单文件最大大小
      max-file-size: 10MB
      # 限制所有文件最大大小
      max-request-size: 1024MB
  mvc:
    favicon:
      enabled: false
  messages:
    basename: i18n.index

server:
  port: 8079
#  ssl:
#    key-store: buguagaoshu.key
#    key-store-type: PKCS12
#    key-alias: buguagaoshu
#    key-store-password: buguagaoshu

# 应用根目录下的文件名
File:
  ROOT:
    PATH: file
  LOG:
    PATH: log


logging:
  level:
    com:
      buguagaoshu:
        community: info
  file:
    name: log/spring.log
  logback:
    rollingpolicy:
      max-history: 7

# 每页广告数
advertisement:
  number: 3

jwt:
  key: buguagaoshu
  ttl: 7200000

# MinIO对象存储
minio:
  server: http://192.168.147.132:9000
  accessKey: admin
  secretKey: admin
  outTime: 86400
  bucket: community


